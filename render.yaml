services:
  # ── Backend FastAPI Web Service ─────────────────────────────────────────────
  - type: web
    name: queryguard-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python run.py"
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_PATH
        value: analytics.db
      - key: FRONTEND_ORIGIN
        value: "*"

  # ── Frontend Next.js Web Service ────────────────────────────────────────────
  - type: web
    name: queryguard-frontend
    runtime: node
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: queryguard-backend
          property: host
      - key: NODE_VERSION
        value: 18.20.0
